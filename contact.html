
<!DOCTYPE html>
<html>
<head>
    <title>Contact Us - Movie World</title>
    <link rel="stylesheet" href= "../src/css/style.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">MOVIE WORLD</a>

            <div>
                <a class="nav-link d-inline text-white" href="index.html">Home</a>
                <a class="nav-link d-inline text-white" href="movies.html">Movies</a>
                <a class="nav-link d-inline text-white" href="about.html">About Us</a>
                <a class="nav-link d-inline text-white" href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">

        <h1 class="text-center">Contact Us</h1>

        <p class="text-center">
            Have a question or suggestion?
            Send us a message!
        </p>

        <form>

            <label>Name:</label>
            <input type="text" class="form-control" placeholder="Enter your name">

            <br>

            <label>Email:</label>
            <input type="email" class="form-control" placeholder="Enter your email">

            <br>

            <label>Message:</label>
            <textarea class="form-control" rows="5"
            placeholder="Write your message"></textarea>

            <br>

            <button type="button" class="btn btn-danger">
                Send Message
            </button>

        </form>
</body>
</html>
